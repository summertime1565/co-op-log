const KEY='sw-l5-trainer-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={answers:{},grades:{},notes:{},times:{},...state};let view='home',filter='all',wrongOnly=false,idx=0,shown=false,clockStart=null,clockTick=null;const $=x=>document.querySelector(x),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('저장 공간을 사용할 수 없습니다. 기록을 내보내 주세요.')}}function list(){return QUESTIONS.filter(q=>(filter==='all'||q.unit===filter)&&(!wrongOnly||state.answers[q.id]?.result!=='correct'&&state.answers[q.id]?.result));}function nav(){const labels=[['home','오늘의 시작'],['quiz','지필 회수'],['practice','실기 수행'],['stats','기록·백업']];$('#tabs').innerHTML=labels.map(([k,v])=>`<button class="${view===k?'active':''}" data-view="${k}">${v}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()})}function render(){nav();({home:home,quiz:quiz,practice:practice,stats:stats}[view])()}
function home(){const done=Object.values(state.grades).filter(x=>x==='A').length;$('#app').innerHTML=`<section class="card"><h2>첫 작업: 실기 공개문제 1회 진단</h2><p>① DB 구현 과제부터 실제 개발 도구에서 수행해 보세요. 단계마다 <b>A 혼자 가능 / B 힌트 필요 / C 따라 해야 함</b>으로 표시합니다. 코드나 실행 결과를 앱이 자동 채점하지는 않습니다.</p><div class="grid"><div class="metric"><strong>${QUESTIONS.length}문항</strong>출처를 표시한 지필 회수 문제</div><div class="metric"><strong>${done}/${PRACTICE.reduce((n,p)=>n+p.steps.length,0)}단계</strong>혼자 수행 가능(A)</div><div class="metric"><strong>4과제</strong>공식 모의평가의 실기 유형</div></div><div class="row" style="margin-top:16px"><button class="primary" id="goPractice">실기 진단 시작</button><button id="goQuiz">지필 10~20문항 풀기</button></div></section><section class="card"><h2>자료 적용 기준</h2><p>이 앱의 실기 과제는 <b>2021년 SW개발 모의평가의 L5 예시</b>를 요약한 학습용 흐름입니다. 2026년 합격 후기는 실기 분량·시간 압박의 참고자료이며 공식 채점 기준은 아닙니다. 보유한 실제 평가 버전과 시험장 개발환경이 확인되면 그 기준으로 과제를 수정하세요.</p><div class="warn">정보처리기사와 범위·체감 난도가 비슷하다는 평가는 학습 난도 감각에만 참고하세요. 이 시험의 합격 방식은 과목별 Pass와 작업 수행이므로 기사 필기 문제만 반복하는 방식으로 대체할 수 없습니다.</div></section>`;$('#goPractice').onclick=()=>{view='practice';render()};$('#goQuiz').onclick=()=>{view='quiz';render()}}
function quiz(){const units=[...new Set(QUESTIONS.map(q=>q.unit))],arr=list();idx=Math.min(idx,Math.max(0,arr.length-1));const q=arr[idx],a=q&&state.answers[q.id],button=q?.type==='ox'?`<div class="row"><button data-ox="O">O</button><button data-ox="X">X</button></div>`:`<label>직접 답하기<input id="answer" autocomplete="off" placeholder="용어를 적어보세요" value="${safe(shown?'':a?.draft||'')}"></label>`;$('#app').innerHTML=`<section class="card"><h2>지필 · 설명을 보고 답 회수</h2><div class="row"><select id="unit"><option value="all">전체 과목</option>${units.map(u=>`<option ${filter===u?'selected':''}>${safe(u)}</option>`).join('')}</select><button id="wrong">${wrongOnly?'✓ ':''}틀림·찍음만</button></div><p class="muted small">현재 ${arr.length}문항 · 맞음/틀림/찍음을 별도 기록합니다. 문제집의 AI 생성 문항은 정답 검증 전이라 넣지 않았습니다.</p></section>${q?`<section class="card"><div class="source">${safe(q.unit)} · ${idx+1}/${arr.length} · ${safe(q.type==='ox'?'O/X':'단답')} · ${safe(q.source)}</div><p class="question">${safe(q.q)}</p>${button}<div class="row"><button id="check" class="primary">정답 확인</button><button id="guessed">찍음 표시</button></div>${shown?`<div class="feedback"><strong>정답: ${safe(q.answers[0])}</strong><p class="small">내 기록: ${safe(a?.value||'미입력')} · ${safe(a?.result==='correct'?'맞음':a?.result==='guess'?'찍음':'틀림')}</p></div>`:''}<div class="row"><button id="prev">← 이전</button><button id="next">다음 →</button></div></section>`:'<section class="card">조건에 맞는 문제가 없습니다. 필터를 변경하세요.</section>'}`;$('#unit').onchange=e=>{filter=e.target.value;idx=0;shown=false;quiz()};$('#wrong').onclick=()=>{wrongOnly=!wrongOnly;idx=0;shown=false;quiz()};if(!q)return;let ox='';document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>{ox=b.dataset.ox;document.querySelectorAll('[data-ox]').forEach(x=>x.classList.toggle('primary',x===b))});function record(guess){const value=q.type==='ox'?ox:$('#answer').value.trim(),normalized=s=>s.toLowerCase().replace(/[\s→_\-]/g,'');if(!value&&!guess){alert('답을 입력하거나 찍음을 표시하세요.');return}state.answers[q.id]={value,result:guess?'guess':q.answers.some(x=>normalized(x)===normalized(value))?'correct':'wrong',at:new Date().toISOString()};persist();shown=true;quiz()}$('#check').onclick=()=>record(false);$('#guessed').onclick=()=>record(true);if($('#answer'))$('#answer').onkeydown=e=>{if(e.key==='Enter')record(false)};$('#prev').onclick=()=>{idx=(idx-1+arr.length)%arr.length;shown=false;quiz()};$('#next').onclick=()=>{idx=(idx+1)%arr.length;shown=false;quiz()}}
function elapsed(){return clockStart?Math.floor((Date.now()-clockStart)/1000):0}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function practice(){let html=`<section class="card"><h2>실기 수행</h2><p>문제 PDF를 옆에 열고 실제 시험 환경과 비슷한 도구에서 직접 작성·실행하세요. 아래는 수행 기록과 힌트 확인용입니다.</p><div class="row"><button id="timer" class="primary">${clockStart?'측정 종료':'시간 측정 시작'}</button><strong id="clock">${fmt(elapsed())}</strong></div><p class="small muted">측정 결과는 아래 기록에 남습니다. 앱 안의 SQL·HTML 입력칸은 메모용이며 실행되지 않습니다.</p></section>`;for(const p of PRACTICE){let n=p.steps.length,done=p.steps.filter((_,i)=>state.grades[p.id+'-'+i]==='A').length;html+=`<section class="card"><h2>${safe(p.title)}</h2><div class="source">${safe(p.source)} · 혼자 가능 ${done}/${n}</div><p>${safe(p.brief)}</p><details><summary>실습 단계 열기</summary>${p.steps.map((s,i)=>`<div class="task"><strong>${i+1}. ${safe(s)}</strong><label>수행 수준 <select data-grade="${p.id}-${i}"><option value="">미진행</option>${[['A','A · 혼자 실행'],['B','B · 힌트로 실행'],['C','C · 따라 해야 함']].map(([v,l])=>`<option value="${v}" ${state.grades[p.id+'-'+i]===v?'selected':''}>${l}</option>`).join('')}</select></label></div>`).join('')}<p class="warn">${safe(p.pitfall)}</p><label>막힌 지점·실행 결과 메모<textarea data-note="${p.id}" placeholder="예: JOIN은 작성했지만 실행 시 컬럼명 오류. 다음에는 ON 연결 키부터 확인.">${safe(state.notes[p.id]||'')}</textarea></label></details></section>`}$('#app').innerHTML=html;document.querySelectorAll('[data-grade]').forEach(x=>x.onchange=()=>{state.grades[x.dataset.grade]=x.value;persist();practice()});document.querySelectorAll('[data-note]').forEach(x=>x.oninput=()=>{state.notes[x.dataset.note]=x.value;persist()});$('#timer').onclick=()=>{if(clockStart){state.times.push({at:new Date().toISOString(),seconds:elapsed()});clockStart=null;clearInterval(clockTick)}else{clockStart=Date.now();clockTick=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(elapsed())},1000)}persist();practice()}}
function stats(){const results=Object.values(state.answers),grades=Object.values(state.grades),byUnit=[...new Set(QUESTIONS.map(q=>q.unit))];$('#app').innerHTML=`<section class="card"><h2>진행 기록</h2><div class="grid"><div class="metric"><strong>${results.length}/${QUESTIONS.length}</strong>답한 지필 문항</div><div class="metric"><strong>${results.filter(x=>x.result==='correct').length}</strong>맞음</div><div class="metric"><strong>${results.filter(x=>x.result==='wrong'||x.result==='guess').length}</strong>틀림·찍음</div><div class="metric"><strong>${grades.filter(x=>x==='A').length}/${PRACTICE.reduce((n,p)=>n+p.steps.length,0)}</strong>실기 A 단계</div></div><h3>과목별 회수</h3>${byUnit.map(u=>{let a=QUESTIONS.filter(q=>q.unit===u);return `<p>${safe(u)}: ${a.filter(q=>state.answers[q.id]?.result==='correct').length}/${a.length} 맞음</p>`}).join('')}<h3>실기 측정 기록</h3>${state.times.length?state.times.slice(-8).reverse().map(t=>`<p>${safe(new Date(t.at).toLocaleString('ko-KR'))} · ${fmt(t.seconds)}</p>`).join(''):'<p class="muted">아직 측정한 기록이 없습니다.</p>'}<h3>학습 기록 백업</h3><p class="small">브라우저를 바꾸거나 GitHub Pages 주소가 바뀌면 기록이 이어지지 않을 수 있습니다. JSON을 내려받아 보관하세요.</p><div class="row"><button id="export">JSON 내보내기</button><label>JSON 가져오기<input id="import" type="file" accept="application/json,.json"></label></div></section>`;$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sw-l5-study-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!data||typeof data!=='object'||!data.answers||!data.grades||!data.notes||!Array.isArray(data.times))throw Error('형식 오류');if(!confirm('현재 기록을 백업 파일로 교체할까요?'))return;state=data;persist();stats()}catch{alert('이 앱에서 내보낸 JSON인지 확인해 주세요.')}}}
render();
</script></body></html>
