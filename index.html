function exam(){const written=['요구사항 확인','제품소프트웨어 패키징','애플리케이션 테스트 관리','소프트웨어 개발 보안 구축'];$('#app').innerHTML=`<section class="card"><h2>2025년도부터의 공식 평가 기준</h2><p class="source">[공개자료]SW개발_L5_20V1('25년도~).pdf · PDF 1·5쪽</p><div class="grid"><div class="metric"><strong>40분</strong>지필 · 4개 능력단위</div><div class="metric"><strong>210분</strong>작업 · 4과제 / 6개 능력단위</div><div class="metric"><strong>7 / 10 Pass</strong>각 능력단위 100점 중 60점 이상</div></div><p>평균 60점이나 전체 문제의 70% 정답이 합격 기준은 아닙니다. 지필 4개를 모두 Pass해도 작업 6개 중 최소 3개를 추가로 Pass해야 합니다. 앱의 학습 기록은 공식 채점 점수로 환산하지 않습니다.</p><h3>능력단위별 평가 방식</h3><div style="overflow:auto"><table><thead><tr><th>평가</th><th>능력단위</th></tr></thead><tbody>${written.map(u=>`<tr><td>지필</td><td>${u}</td></tr>`).join('')}<tr><td>작업 제1과제</td><td>데이터 입출력 구현 · SQL 응용</td></tr><tr><td>작업 제2과제</td><td>통합구현 · 인터페이스 구현</td></tr><tr><td>작업 제3과제</td><td>서버프로그램 구현</td></tr><tr><td>작업 제4과제</td><td>화면 설계</td></tr></tbody></table></div><p>이 자료의 능력단위 표에는 면접이 지정되어 있지 않습니다. 구판의 면접 안내보다 이 자료를 우선합니다.</p></section><section class="card"><h2>지필 유형 6가지</h2><p>진위형 · 선다형(보기 제시) · 연결형 · 순수단답형 · 완성형 · 복수단답형. 모든 유형이 반드시 출제되는 것은 아닙니다.</p><p>공개 예시 18문항을 별도 필터로 제공합니다. 원문에는 정답표가 없어 앱의 답은 학습용 해설 답안입니다. 복수 정답이 가능한 문항은 직접 판정합니다.</p></section><section class="card"><h2>작업 환경과 제출</h2><p>공개자료 기재: Windows 10 이상, Java SE JDK 8.0.20, Eclipse Java EE IDE(Luna SR2), Apache Tomcat 8.0.26, Oracle 11g XE 11.2. 과제·시험장에 따라 달라질 수 있으므로 실제 수험 안내를 확인하세요.</p><p>제1과제는 SQL Plus 작업 후 SQL을 메모장에 작성하여 바탕화면에 <b>SQL_비번.txt</b>로 저장하도록 안내합니다. 지참공구는 흑색볼펜 1개이며, USB는 시험장 지급재료입니다.</p><p class="warn">공개 예시는 완전한 실습 패키지가 아닙니다. 제2과제의 기존 제품코드 시스템과 제4과제의 상세 요구사항·표준 양식 등은 실제 지급자료가 필요합니다. 앱은 SQL/JSP 실행 환경을 제공하지 않습니다.</p></section>`}

function home(){const done=Object.values(state.grades).filter(x=>x==='A').length;$('#app').innerHTML=`<section class="card"><h2>오늘은 작은 한 단계부터</h2><p class="source">2025년도~ 공식자료 반영 · 지필 40분 / 작업 210분 · 상세 기준은 ‘공식 시험 안내’</p><p>지금은 DB와 서버를 한 번에 구현하는 단계로 가정하지 않을게요. 먼저 <b>테이블·행·열·기본키를 구분하고, SELECT 한 문장을 직접 적는 것</b>으로 시작합니다. 도구 설치 여부와 현재 실력도 그 과정에서 확인할 수 있어요.</p><div class="row"><button class="primary" id="start">0단계부터 시작</button><button id="overview">공개 실기 과제 미리 보기</button></div></section><section class="card"><h2>5일의 학습 순서</h2><p>1일차: 작은 SQL과 개발환경 확인 → 2일차: CREATE TABLE·INSERT·JOIN → 3일차: 서버·인터페이스의 입력/조회/출력 → 4~5일차: 공개과제 완주와 지필 오답 회수. 각 단계에서 막히면 그 개념만 짧게 공부합니다.</p><p class="small muted">현재 실기 A 단계 ${done}개. 지필 문제는 개념을 처음 접하는 설명이 아니라 <b>배운 뒤 기억에서 꺼내는 연습</b>입니다.</p></section>`;$('#start').onclick=()=>{view='foundation';render()};$('#overview').onclick=()=>{view='practice';render()}}

{title:'조건으로 한 행 찾기',ex:"조건은 WHERE. 문자열 값은 작은따옴표로 묶습니다. 예: WHERE custid = 'aaa'",prompt:"customers에서 custid가 'aaa'인 행의 name을 조회하세요.",answer:"SELECT name FROM customers WHERE custid = 'aaa';",hint:"SELECT name FROM customers WHERE custid = 'aaa';"},

function foundation(){const m=MINI[miniIndex],result=state.mini?.[miniIndex];$('#app').innerHTML=`<section class="card"><div class="source">기초 준비 · ${miniIndex+1}/${MINI.length} · 본 실기 과제에 들어가기 전 연습</div><h2>${safe(m.title)}</h2><p>${safe(m.ex)}</p><p class="question">${safe(m.prompt)}</p><input id="miniAnswer" aria-label="연습 답안" value="${safe(result?.value||'')}" placeholder="여기에 직접 적기"><div class="row" style="margin-top:12px"><button id="miniCheck" class="primary">확인</button><button id="miniHint">힌트</button><button id="miniNext">다음 단계 →</button></div><div id="miniFeedback" class="feedback ${miniShown?'':'hidden'}">${miniShown?`<b>${safe(result?.status||'')}</b><p>${safe(result?.message||'')}</p>`:''}</div><p class="small muted">여기서 SQL을 실행하지 않습니다. 문장을 작성할 수 있는지 확인하는 연습입니다.</p></section>`;$('#miniHint').onclick=()=>{$('#miniFeedback').classList.remove('hidden');$('#miniFeedback').textContent=m.hint};$('#miniCheck').onclick=()=>{const value=$('#miniAnswer').value.trim(),normalize=x=>x.toLowerCase().replace(/[\s;]+/g,' ').trim().replace(/ $/,'');if(!value){alert('답을 먼저 적어 보세요.');return}const ok=m.answer===null||normalize(value)===normalize(m.answer),status=m.answer===null?'환경 메모 저장':ok?'맞았어요':'다시 확인해 보세요';state.mini=state.mini||{};state.mini[miniIndex]={value,status,message:m.answer===null?'실제 실행 환경은 다음 실습에서 별도로 확인합니다.':ok?'이 문장을 보고 다시 쓰지 않고 한 번 더 작성해 보세요.':'예시와 조건·열 이름을 비교해 보세요.',at:new Date().toISOString()};persist();miniShown=true;foundation()};$('#miniNext').onclick=()=>{miniIndex=(miniIndex+1)%MINI.length;miniShown=false;foundation()};$('#miniAnswer').onkeydown=e=>{if(e.key==='Enter')$('#miniCheck').click()}}
function quiz(){const units=[...new Set(ALL_QUESTIONS.map(q=>q.unit))],arr=list();idx=Math.min(idx,Math.max(0,arr.length-1));const q=arr[idx],a=q&&state.answers[q.id],button=q?.type==='ox'?`<div class="row"><button data-ox="O">O</button><button data-ox="X">X</button></div>`:`<label>직접 답하기<input id="answer" autocomplete="off" placeholder="용어를 적어보세요" value="${safe(shown?'':a?.draft||'')}"></label>`;$('#app').innerHTML=`<section class="card"><h2>지필 회수 · 실기 보조 개념</h2><div class="row"><select id="bank"><option value="official" ${bank==='official'?'selected':''}>2025~ 공식 예시</option><option value="core" ${bank==='core'?'selected':''}>기존 기본·실기 보조</option><option value="ai" ${bank==='ai'?'selected':''}>AI 연습문제</option><option value="all" ${bank==='all'?'selected':''}>전체</option></select><select id="unit"><option value="all">전체 과목</option>${units.map(u=>`<option ${filter===u?'selected':''}>${safe(u)}</option>`).join('')}</select><button id="wrong">${wrongOnly?'✓ ':''}틀림·찍음만</button></div><p class="muted small">공식 예시 18문항 추가 · 현재 ${arr.length}문항 · AI 연습문제 ${AI_QUESTIONS.length}개 포함. 공식 예시는 출제 유형 안내이며 실제 출제를 보장하지 않습니다. SQL 응용은 작업평가 보조, 공통 문법은 유형 예시입니다. 앱 정답률은 능력단위 Pass 점수가 아닙니다.</p></section>${q?`<section class="card"><div class="source">${safe(q.unit)} · ${idx+1}/${arr.length} · ${safe(q.format||(q.type==='ox'?'진위형':'단답'))} · ${safe(q.source)}</div><p class="question" style="white-space:pre-line">${safe(q.q)}</p>${button}<div class="row"><button id="check" class="primary">정답 확인</button><button id="guessed">찍음 표시</button></div>${shown?`<div class="feedback"><strong>${q.bank==='official'?'학습용 해설 답안':'정답'}: ${safe(q.answers[0])}</strong>${q.note?`<p>${safe(q.note)}</p>`:''}<p class="small">내 기록: ${safe(a?.value||'미입력')} · ${safe(a?.result==='correct'?'맞음':a?.result==='guess'?'찍음':a?.result==='review'?'직접 판정 대기':'틀림')}</p></div>`:''}${shown?`<div class="row"><button id="manualCorrect">내 답도 정답 인정</button><button id="manualWrong">오답으로 표시</button></div>`:``}<div class="row"><button id="prev">← 이전</button><button id="next">다음 →</button></div></section>`:'<section class="card">조건에 맞는 문제가 없습니다. 필터를 변경하세요.</section>'}`;$('#bank').onchange=e=>{bank=e.target.value;idx=0;shown=false;quiz()};$('#unit').onchange=e=>{filter=e.target.value;idx=0;shown=false;quiz()};$('#wrong').onclick=()=>{wrongOnly=!wrongOnly;idx=0;shown=false;quiz()};if(!q)return;let ox='';document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>{ox=b.dataset.ox;document.querySelectorAll('[data-ox]').forEach(x=>x.classList.toggle('primary',x===b))});function record(guess){const value=q.type==='ox'?ox:$('#answer').value.trim(),normalized=s=>s.toLowerCase().replace(/[\s→_,，\-]/g,'');if(!value&&!guess){alert('답을 입력하거나 찍음을 표시하세요.');return}state.answers[q.id]={value,result:guess?'guess':q.manual?'review':(q.setAnswer?normalized(value.split(/[,，]/).map(x=>x.trim()).sort().join(','))===normalized(q.answers[0].split(',').map(x=>x.trim()).sort().join(',')):q.answers.some(x=>normalized(x)===normalized(value)))?'correct':'wrong',at:new Date().toISOString()};persist();shown=true;quiz()}$('#check').onclick=()=>record(false);$('#guessed').onclick=()=>record(true);if($('#answer'))$('#answer').onkeydown=e=>{if(e.key==='Enter')record(false)};if(shown){$('#manualCorrect').onclick=()=>{state.answers[q.id].result='correct';persist();quiz()};$('#manualWrong').onclick=()=>{state.answers[q.id].result='wrong';persist();quiz()}}$('#prev').onclick=()=>{idx=(idx-1+arr.length)%arr.length;shown=false;quiz()};$('#next').onclick=()=>{idx=(idx+1)%arr.length;shown=false;quiz()}}
function elapsed(){return clockStart?Math.floor((Date.now()-clockStart)/1000):0}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}function practice(){let html=`<section class="card"><h2>실기 수행 · 총 210분</h2><p class="source">4과제 → 6개 능력단위 평가. 과제별 시간 배분은 공식 지정되어 있지 않습니다.</p><p>0단계에서 SELECT 문장과 사용 가능한 도구를 확인한 뒤 시작하세요. 문제 PDF를 옆에 열고 실제 도구에서 작성·실행합니다. 아래는 수행 기록과 힌트 확인용입니다.</p><div class="row"><button id="timer" class="primary">${clockStart?'측정 종료':'시간 측정 시작'}</button><strong id="clock">${fmt(elapsed())}</strong><span id="remaining"> / 210분 기준 남은 시간 ${fmt(Math.max(0,12600-elapsed()))}</span></div><p class="small muted">측정 결과는 아래 기록에 남습니다. 앱 안의 SQL·HTML 입력칸은 메모용이며 실행되지 않습니다.</p></section>`;for(const p of PRACTICE){let n=p.steps.length,done=p.steps.filter((_,i)=>state.grades[p.id+'-'+i]==='A').length;html+=`<section class="card"><h2>${safe(p.title)}</h2><div class="source">${safe(p.source)} · 혼자 가능 ${done}/${n}</div><p>${safe(p.brief)}</p><details><summary>실습 단계 열기</summary>${p.steps.map((s,i)=>`<div class="task"><strong>${i+1}. ${safe(s)}</strong><label>수행 수준 <select data-grade="${p.id}-${i}"><option value="">미진행</option>${[['A','A · 혼자 실행'],['B','B · 힌트로 실행'],['C','C · 따라 해야 함']].map(([v,l])=>`<option value="${v}" ${state.grades[p.id+'-'+i]===v?'selected':''}>${l}</option>`).join('')}</select></label></div>`).join('')}<p class="warn">${safe(p.pitfall)}</p><label>막힌 지점·실행 결과 메모<textarea data-note="${p.id}" placeholder="예: JOIN은 작성했지만 실행 시 컬럼명 오류. 다음에는 ON 연결 키부터 확인.">${safe(state.notes[p.id]||'')}</textarea></label></details></section>`}$('#app').innerHTML=html;document.querySelectorAll('[data-grade]').forEach(x=>x.onchange=()=>{state.grades[x.dataset.grade]=x.value;persist();practice()});document.querySelectorAll('[data-note]').forEach(x=>x.oninput=()=>{state.notes[x.dataset.note]=x.value;persist()});$('#timer').onclick=()=>{if(clockStart){state.times.push({at:new Date().toISOString(),seconds:elapsed()});clockStart=null;clearInterval(clockTick)}else{clockStart=Date.now();clockTick=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(elapsed());const left=$('#remaining');if(left)left.textContent=elapsed()>12600?' / 210분 초과':' / 210분 기준 남은 시간 '+fmt(12600-elapsed())},1000)}persist();practice()}}
function stats(){const results=Object.values(state.answers),grades=Object.values(state.grades),byUnit=[...new Set(ALL_QUESTIONS.map(q=>q.unit))];$('#app').innerHTML=`<section class="card"><h2>진행 기록</h2><div class="grid"><div class="metric"><strong>${results.length}/${ALL_QUESTIONS.length}</strong>답한 지필 문항</div><div class="metric"><strong>${results.filter(x=>x.result==='correct').length}</strong>맞음</div><div class="metric"><strong>${results.filter(x=>x.result==='wrong'||x.result==='guess').length}</strong>틀림·찍음</div><div class="metric"><strong>${grades.filter(x=>x==='A').length}/${PRACTICE.reduce((n,p)=>n+p.steps.length,0)}</strong>실기 A 단계</div></div><h3>과목별 회수</h3>${byUnit.map(u=>{let a=ALL_QUESTIONS.filter(q=>q.unit===u);return `<p>${safe(u)}: ${a.filter(q=>state.answers[q.id]?.result==='correct').length}/${a.length} 맞음</p>`}).join('')}<h3>실기 측정 기록</h3>${state.times.length?state.times.slice(-8).reverse().map(t=>`<p>${safe(new Date(t.at).toLocaleString('ko-KR'))} · ${fmt(t.seconds)}</p>`).join(''):'<p class="muted">아직 측정한 기록이 없습니다.</p>'}<h3>학습 기록 백업</h3><p class="small">브라우저를 바꾸거나 GitHub Pages 주소가 바뀌면 기록이 이어지지 않을 수 있습니다. JSON을 내려받아 보관하세요.</p><div class="row"><button id="export">JSON 내보내기</button><label>JSON 가져오기<input id="import" type="file" accept="application/json,.json"></label></div></section>`;$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sw-l5-study-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!data||typeof data!=='object'||!data.answers||!data.grades||!data.notes||!Array.isArray(data.times))throw Error('형식 오류');if(!confirm('현재 기록을 백업 파일로 교체할까요?'))return;state=data;persist();stats()}catch{alert('이 앱에서 내보낸 JSON인지 확인해 주세요.')}}}
try{document.documentElement.dataset.theme=localStorage.getItem('sw-l5-theme')||'light'}catch{}$('#theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('sw-l5-theme',next)}catch{}render()};render();
</script></body></html>
