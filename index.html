function normalize(s){return String(s??'').toLowerCase().replace(/[\s;→_,，\-]/g,'').replace(/\.\.\./g,'').trim()}
function list(){return ALL_QUESTIONS.filter(q=>(bank==='all'||bank==='priority'&&isPriority(q)||(q.bank||'core')===bank)&&(filter==='all'||q.unit===filter)&&(!wrongOnly||state.answers[q.id]?.result!=='correct'&&state.answers[q.id]?.result));}

function home(){const grades=Object.values(state.grades),A=grades.filter(x=>x==='A').length,total=PRACTICE.reduce((n,p)=>n+p.steps.length,0),latest=Object.values(state.answers),wrong=latest.filter(x=>x.result==='wrong'||x.result==='guess').length;$('#app').innerHTML=`<section class="card"><h2>오늘은 Day ${state.day}</h2><div class="row">${[1,2,3,4].map(d=>`<button class="daybtn ${state.day===d?'active':''}" data-day="${d}">${['월','화','수','목'][d-1]} · ${d}일차</button>`).join('')}</div><div class="sourcebox compact">${DAY_PLAN[state.day].map((x,i)=>`<p><b>${i+1}.</b> ${x}</p>`).join('')}</div><div class="row"><button class="primary" id="goPractice">실기 진단/수행</button><button id="goQuiz">지필 핵심 회수</button><button id="goLabs">막힌 단계 연습</button></div></section><section class="card"><h2>현재 상태</h2><div class="grid"><div class="metric"><strong>${A}/${total}</strong>실기 A · 혼자 실행</div><div class="metric"><strong>${wrong}</strong>최근 틀림·찍음</div><div class="metric"><strong>${state.attempts.length}</strong>누적 지필 시도</div></div><p class="small muted">핵심 원칙: 전체 과제를 먼저 해본다 → 막힌 단계만 Micro-Lab으로 내려간다 → 다시 전체 과제로 돌아온다. AI 문제를 많이 푸는 것이 목표가 아니다.</p></section><section class="card"><h2>자료 사용 우선순위</h2><p><span class="chip official">1 공식 L5 공개자료</span><span class="chip core">2 최종정리·모의평가</span><span class="chip">3 합격 후기/영상 절차</span><span class="chip ai">4 AI 회상문제</span></p><p class="small muted">공식 자료는 형식·명세 기준, 영상은 구현 순서 참고, 합격 후기는 실제 체감 참고, AI 문제는 이미 확인된 개념의 회상 연습으로만 사용한다.</p></section>`;document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;persist();home()});$('#goPractice').onclick=()=>{view='practice';render()};$('#goQuiz').onclick=()=>{view='quiz';render()};$('#goLabs').onclick=()=>{view='labs';render()}}
function labs(){const groups=[...new Set(LABS.map(x=>x.group))],arr=LABS.filter(x=>x.group===labGroup);labIndex=Math.min(labIndex,arr.length-1);const m=arr[labIndex],saved=state.mini[m.id];$('#app').innerHTML=`<section class="card"><h2>Micro-Lab · 막힌 단계만</h2><div class="row">${groups.map(g=>`<button data-group="${g}" class="${labGroup===g?'primary':''}">${g}</button>`).join('')}</div><p class="small muted">처음부터 전부 외우는 코스가 아니다. 실기에서 C/B가 나온 단계만 골라 1~3분 연습하고 원래 과제로 돌아간다.</p></section><section class="card"><div class="source">${safe(m.group)} · ${labIndex+1}/${arr.length} · ${safe(m.source)}</div><h2>${safe(m.title)}</h2><p>${safe(m.ex)}</p><p class="question">${safe(m.prompt)}</p><textarea id="labAnswer" placeholder="직접 적어보세요">${safe(saved?.value||'')}</textarea><div class="row"><button class="primary" id="labCheck">확인</button><button id="labHint">힌트</button><button id="labPrev">← 이전</button><button id="labNext">다음 →</button></div><div id="labFeedback" class="feedback ${labShown?'':'hidden'}">${labShown?`<b>${safe(saved?.status||'')}</b><p>${safe(saved?.message||'')}</p>`:''}</div></section>`;document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{labGroup=b.dataset.group;labIndex=0;labShown=false;labs()});$('#labHint').onclick=()=>{const e=$('#labFeedback');e.classList.remove('hidden');e.innerHTML=`<b>힌트</b><p class="code">${safe(m.hint)}</p>`};$('#labCheck').onclick=()=>{const value=$('#labAnswer').value.trim();if(!value){alert('답을 먼저 적어 보세요.');return}const ok=m.answers.some(a=>normalize(a)===normalize(value));state.mini[m.id]={value,status:ok?'맞았어요':'다시 확인',message:ok?'이제 답을 가리고 한 번 더 적거나 원래 실기로 돌아가세요.':'힌트를 확인한 뒤 같은 단계만 다시 써 보세요.',at:new Date().toISOString()};persist();labShown=true;labs()};$('#labPrev').onclick=()=>{labIndex=(labIndex-1+arr.length)%arr.length;labShown=false;labs()};$('#labNext').onclick=()=>{labIndex=(labIndex+1)%arr.length;labShown=false;labs()}}
function quiz(){const units=[...new Set(ALL_QUESTIONS.map(q=>q.unit))],arr=list();idx=Math.min(idx,Math.max(0,arr.length-1));const q=arr[idx],a=q&&state.answers[q.id],attempts=q?latestAttempts(q.id):[],button=q?.type==='ox'?`<div class="row"><button data-ox="O">O</button><button data-ox="X">X</button></div>`:`<label>직접 답하기<input id="answer" autocomplete="off" placeholder="용어를 적어보세요"></label>`;$('#app').innerHTML=`<section class="card"><h2>지필 회수</h2><div class="row"><select id="bank"><option value="priority" ${bank==='priority'?'selected':''}>4일 핵심 회수</option><option value="official" ${bank==='official'?'selected':''}>공식 공개예시</option><option value="core" ${bank==='core'?'selected':''}>최종정리·실기보조</option><option value="ai" ${bank==='ai'?'selected':''}>AI 회상문제</option><option value="all" ${bank==='all'?'selected':''}>전체</option></select><select id="unit"><option value="all">전체 과목</option>${units.map(u=>`<option ${filter===u?'selected':''}>${safe(u)}</option>`).join('')}</select><button id="wrong">${wrongOnly?'✓ ':''}틀림·찍음만</button></div><p class="small muted">기본값은 공식/핵심 자료와 합격 후기에서 반복 강조된 개념 중심이다. AI 문제은행은 보조이며 전부 푸는 것이 목표가 아니다.</p></section>${q?`<section class="card">${sourceChip(q)}<div class="source">${safe(q.unit)} · ${idx+1}/${arr.length} · ${safe(q.format||(q.type==='ox'?'진위형':'단답'))} · ${safe(q.source)}</div><p class="question" style="white-space:pre-line">${safe(q.q)}</p>${button}<div class="row"><button id="check" class="primary">정답 확인</button><button id="guessed">찍음 표시</button></div>${shown?`<div class="feedback"><strong>${q.bank==='official'?'학습용 해설 답안':'정답'}: ${safe(q.answers[0])}</strong>${q.note?`<p>${safe(q.note)}</p>`:''}<p class="small">최근 기록: ${safe(a?.value||'미입력')} · ${safe(a?.result==='correct'?'맞음':a?.result==='guess'?'찍음':a?.result==='review'?'직접 판정 대기':'틀림')}</p></div><div class="row"><button id="manualCorrect">내 답도 정답 인정</button><button id="manualWrong">오답으로 표시</button></div>`:''}${attempts.length?`<p class="history">최근 시도: ${attempts.map(x=>x.result==='correct'?'✓':x.result==='guess'?'?':'×').join(' → ')}</p>`:''}<div class="sticky-actions row"><button id="prev">← 이전</button><button id="next">다음 →</button></div></section>`:'<section class="card">조건에 맞는 문제가 없습니다.</section>'}`;$('#bank').onchange=e=>{bank=e.target.value;idx=0;shown=false;quiz()};$('#unit').onchange=e=>{filter=e.target.value;idx=0;shown=false;quiz()};$('#wrong').onclick=()=>{wrongOnly=!wrongOnly;idx=0;shown=false;quiz()};if(!q)return;let ox='';document.querySelectorAll('[data-ox]').forEach(b=>b.onclick=()=>{ox=b.dataset.ox;document.querySelectorAll('[data-ox]').forEach(x=>x.classList.toggle('primary',x===b))});function record(guess){const value=q.type==='ox'?ox:$('#answer').value.trim();if(!value&&!guess){alert('답을 입력하거나 찍음을 표시하세요.');return}const result=guess?'guess':q.manual?'review':(q.setAnswer?normalize(value.split(/[,，]/).map(x=>x.trim()).sort().join(','))===normalize(q.answers[0].split(',').map(x=>x.trim()).sort().join(',')):q.answers.some(x=>normalize(x)===normalize(value)))?'correct':'wrong';const rec={qid:q.id,value,result,at:new Date().toISOString()};state.answers[q.id]={value,result,at:rec.at};state.attempts.push(rec);persist();shown=true;quiz()}$('#check').onclick=()=>record(false);$('#guessed').onclick=()=>record(true);if($('#answer'))$('#answer').onkeydown=e=>{if(e.key==='Enter')record(false)};if(shown){$('#manualCorrect').onclick=()=>{const rec={qid:q.id,value:state.answers[q.id]?.value||'',result:'correct',at:new Date().toISOString(),manual:true};state.answers[q.id]={value:rec.value,result:'correct',at:rec.at};state.attempts.push(rec);persist();quiz()};$('#manualWrong').onclick=()=>{const rec={qid:q.id,value:state.answers[q.id]?.value||'',result:'wrong',at:new Date().toISOString(),manual:true};state.answers[q.id]={value:rec.value,result:'wrong',at:rec.at};state.attempts.push(rec);persist();quiz()}}$('#prev').onclick=()=>{idx=(idx-1+arr.length)%arr.length;shown=false;quiz()};$('#next').onclick=()=>{idx=(idx+1)%arr.length;shown=false;quiz()}}
function elapsed(){return clockStart?Math.floor((Date.now()-clockStart)/1000):0}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function practice(){let html=`<section class="card"><h2>실기 수행 · 210분</h2><p class="source">공식 공개자료: 4과제 / 6개 작업 능력단위</p><p><b>먼저 전체 과제를 해본다.</b> 막힌 단계가 C/B면 연결된 Micro-Lab만 짧게 보고 다시 돌아온다.</p><div class="row"><button id="timer" class="primary">${clockStart?'측정 종료':'시간 측정 시작'}</button><strong id="clock">${fmt(elapsed())}</strong><span id="remaining"> / 남은 시간 ${fmt(Math.max(0,12600-elapsed()))}</span></div></section>`;for(const p of PRACTICE){const done=p.steps.filter(s=>state.grades[s.id]==='A').length;html+=`<section class="card"><h2>${safe(p.title)}</h2><div class="source">${safe(p.units)} · ${safe(p.source)} · A ${done}/${p.steps.length}</div><p>${safe(p.brief)}</p><details open><summary>수행 단계</summary>${p.steps.map((s,i)=>{const g=state.grades[s.id]||'',trail=gradeTrail(s.id);return `<div class="task"><div class="stepgrid"><div><strong>${i+1}. ${safe(s.label)}</strong>${trail?`<div class="history">변화: ${safe(trail)}</div>`:''}${s.lab&&g&&g!=='A'?`<button class="small" data-lab="${s.lab}">이 단계만 연습</button>`:''}</div><select data-grade="${s.id}"><option value="">미진행</option><option value="A" ${g==='A'?'selected':''}>A · 혼자 실행</option><option value="B" ${g==='B'?'selected':''}>B · 힌트로 실행</option><option value="C" ${g==='C'?'selected':''}>C · 따라 해야 함</option></select></div></div>`}).join('')}<p class="warn">${safe(p.pitfall)}</p><label>막힌 지점·실행 결과 메모<textarea data-note="${p.id}" placeholder="어디서 멈췄는지 한 줄만">${safe(state.notes[p.id]||'')}</textarea></label></details></section>`}$('#app').innerHTML=html;document.querySelectorAll('[data-grade]').forEach(x=>x.onchange=()=>{const step=x.dataset.grade,grade=x.value;state.grades[step]=grade;if(grade)state.gradeHistory.push({step,grade,at:new Date().toISOString()});persist();practice()});document.querySelectorAll('[data-note]').forEach(x=>x.onchange=()=>{state.notes[x.dataset.note]=x.value;persist()});document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{const id=b.dataset.lab,m=LABS.find(x=>x.id===id);if(m){labGroup=m.group;labIndex=LABS.filter(x=>x.group===m.group).findIndex(x=>x.id===id);view='labs';labShown=false;render()}});$('#timer').onclick=()=>{if(clockStart){state.times.push({at:new Date().toISOString(),seconds:elapsed()});clockStart=null;clearInterval(clockTick)}else{clockStart=Date.now();clockTick=setInterval(()=>{const e=$('#clock');if(e)e.textContent=fmt(elapsed());const left=$('#remaining');if(left)left.textContent=elapsed()>12600?' / 210분 초과':' / 남은 시간 '+fmt(12600-elapsed())},1000)}persist();practice()}}
function stats(){const latest=Object.values(state.answers),grades=Object.values(state.grades),byUnit=[...new Set(ALL_QUESTIONS.map(q=>q.unit))];const histories=PRACTICE.flatMap(p=>p.steps).map(s=>({s,trail:gradeTrail(s.id)})).filter(x=>x.trail);$('#app').innerHTML=`<section class="card"><h2>진행 기록</h2><div class="grid"><div class="metric"><strong>${latest.length}/${ALL_QUESTIONS.length}</strong>답한 고유 지필</div><div class="metric"><strong>${state.attempts.length}</strong>누적 지필 시도</div><div class="metric"><strong>${latest.filter(x=>x.result==='wrong'||x.result==='guess').length}</strong>최근 틀림·찍음</div><div class="metric"><strong>${grades.filter(x=>x==='A').length}/${PRACTICE.reduce((n,p)=>n+p.steps.length,0)}</strong>실기 A 단계</div></div><h3>과목별 최근 회수</h3>${byUnit.map(u=>{const a=ALL_QUESTIONS.filter(q=>q.unit===u),answered=a.filter(q=>state.answers[q.id]);return `<div class="progressline"><span style="min-width:190px">${safe(u)}</span><div class="bar"><i style="width:${answered.length?100*answered.filter(q=>state.answers[q.id]?.result==='correct').length/answered.length:0}%"></i></div><span>${answered.filter(q=>state.answers[q.id]?.result==='correct').length}/${answered.length||0}</span></div>`}).join('')}<h3>실기 변화</h3>${histories.length?histories.map(x=>`<p><b>${safe(x.s.label)}</b><br><span class="history">${safe(x.trail)}</span></p>`).join(''):'<p class="muted">아직 실기 변화 기록이 없습니다.</p>'}<h3>210분 측정 기록</h3>${state.times.length?state.times.slice(-8).reverse().map(t=>`<p>${safe(new Date(t.at).toLocaleString('ko-KR'))} · ${fmt(t.seconds)}</p>`).join(''):'<p class="muted">아직 기록이 없습니다.</p>'}</section><section class="card"><h2>학습 기록 백업</h2><p class="small">기존 v1 localStorage 키를 유지하므로 같은 브라우저/주소에서는 이전 기록을 이어받습니다. 그래도 수정 전 JSON 백업을 권장합니다.</p><div class="row"><button id="export">JSON 내보내기</button><label>JSON 가져오기<input id="import" type="file" accept="application/json,.json"></label></div></section>`;$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sw-l5-study-backup-v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!data||typeof data!=='object')throw Error();if(!confirm('현재 기록을 백업 파일로 교체할까요?'))return;state={answers:{},grades:{},notes:{},times:[],mini:{},attempts:[],gradeHistory:[],day:1,...data};if(state.day>4)state.day=4;persist();stats()}catch{alert('JSON 형식을 확인해 주세요.')}}}
try{document.documentElement.dataset.theme=localStorage.getItem('sw-l5-theme')||'light'}catch{}$('#theme').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('sw-l5-theme',next)}catch{}render()};render();

</script></body></html>
